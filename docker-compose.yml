services:
  postgres:
    image: postgres:16-alpine
    container_name: wpd-postgres
    environment:
      POSTGRES_DB: well_production_decline
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d well_production_decline"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - wpd_postgres_data:/var/lib/postgresql/data

volumes:
  wpd_postgres_data:
