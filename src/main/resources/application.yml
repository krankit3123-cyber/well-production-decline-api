server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: well-production-decline-api
  datasource:
    url: jdbc:postgresql://localhost:15433/well_production_decline
    username: app_user
    password: app_password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
